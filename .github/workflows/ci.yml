name: CI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '16 6 * * 2'

permissions:
  contents: write
  security-events: write
  pull-requests: read
  packages: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
      docker: ${{ steps.filter.outputs.docker }}
      dockerhub_description: ${{ steps.filter.outputs.dockerhub_description }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            # 'src' is true if any file NOT in the list below has changed.
            # This captures all code and configuration changes that require testing.
            src:
              - '**'
              - '!(README.md|docs/**|examples/**)'
            docker:
              - '**'
              - '!({README.md,GEMINI.md,LICENSE,.gitignore,.goreleaser.yaml,.github/**,docs/**,examples/**,tests/**,bin/**,build/**,dist/**,*.out})'
            # The 'docker' job builds and pushes the image but never publishes the
            # repository overview, so the description needs its own trigger.
            dockerhub_description:
              - 'docs/dockerhub-overview.md'
              - '.github/workflows/ci.yml'

  test:
    needs: changes
    if: needs.changes.outputs.src == 'true' || github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: make install
      - name: Run linting and format checks
        run: make lint
      - name: Run tests
        run: make coverage
        env:
          CI: true
      - name: Run tests under the race detector
        run: make test-race
        env:
          CI: true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          token: ${{ secrets.CODECOV_TOKEN }}

  # Function-level complexity gate. Runs standalone so a threshold breach shows
  # as its own red check; the thresholds themselves live in .golangci.yml and are
  # also enforced by `make lint`.
  complexity:
    needs: changes
    if: needs.changes.outputs.src == 'true' || github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run complexity analysis
        run: make complexity

  docker:
    needs: [changes, test]
    if: |
      (needs.changes.outputs.docker == 'true' || github.event_name == 'push' && contains(github.ref, 'refs/tags/')) &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mcp-acdc-server
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publishes docs/dockerhub-overview.md as the Docker Hub repository overview.
  # Deliberately not a dependency of status-check: it only runs on the default
  # branch, so a Docker Hub API failure should not retroactively fail CI.
  # The overview duplicates the configuration tables in docs/configuration.md and
  # the two must stay in sync.
  # Docker Hub's Markdown renderer supports neither GitHub alert syntax ([!NOTE],
  # [!IMPORTANT], ...) nor raw HTML, so the overview must stick to plain Markdown
  # and plain blockquotes.
  dockerhub-description:
    needs: changes
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.changes.outputs.dockerhub_description == 'true'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Update Docker Hub repository overview
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          # Requires a Docker Hub PAT with read/write/delete scope; the
          # read/write scope that suffices for image pushes is rejected here.
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/mcp-acdc-server
          readme-filepath: ./docs/dockerhub-overview.md
          short-description: "Agent Content Discovery Companion (ACDC) — MCP server for searchable AI-agent access to Markdown"

  # This job acts as a bridge for documentation-only PRs to satisfy status checks
  status-check:
    needs: [changes, test, complexity, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify status
        run: |
          if [[ "${{ needs.test.result }}" == "failure" || "${{ needs.complexity.result }}" == "failure" || "${{ needs.docker.result }}" == "failure" ]]; then
            echo "One or more critical jobs failed."
            exit 1
          fi
          echo "All critical jobs passed or were skipped."
