name-template: 'v$RESOLVED_VERSION 🌈'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '🚀 Features'
    when:
      labels:
        - 'feature'
        - 'enhancement'
  - title: '🐛 Bug Fixes'
    when:
      labels:
        - 'fix'
        - 'bugfix'
        - 'bug'
  - title: '📖 Documentation'
    when:
      labels:
        - 'documentation'
        - 'docs'
  - title: '🧪 Testing'
    when:
      labels:
        - 'test'
        - 'testing'
  - title: '🧰 Maintenance'
    when:
      labels:
        - 'chore'
        - 'refactor'
        - 'style'
        - 'perf'
        - 'build'
        - 'ci'
  - title: '📦 Dependency Updates'
    when:
      labels:
        - 'dependencies'
        - 'deps'
  - type: 'version-resolver'
    semver-increment: 'major'
    when:
      labels:
        - 'major'
        - 'breaking'
  - type: 'version-resolver'
    semver-increment: 'minor'
    when:
      labels:
        - 'minor'
        - 'feature'
        - 'enhancement'
  - type: 'version-resolver'
    semver-increment: 'patch'
    when:
      labels:
        - 'patch'
        - 'fix'
        - 'bugfix'
        - 'bug'
        - 'chore'
        - 'dependencies'
        - 'documentation'
        - 'test'
  - type: 'version-resolver'
    semver-increment: 'patch'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&#@'
autolabeler:
  - label: 'major'
    title:
      - '/!:/'
  - label: 'feature'
    title:
      - '/^feat/i'
  - label: 'fix'
    title:
      - '/^fix/i'
  - label: 'documentation'
    title:
      - '/^docs/i'
    files:
      - 'README.md'
      - 'docs/**'
      - 'examples/**'
  - label: 'chore'
    title:
      - '/^chore/i'
      - '/^build/i'
      - '/^ci/i'
      - '/^style/i'
      - '/^refactor/i'
      - '/^perf/i'
  - label: 'test'
    title:
      - '/^test/i'
    files:
      - 'tests/**'
  - label: 'dependencies'
    title:
      - '/^deps/i'
    branch:
      - '/^dependabot/'
template: |
  ## Changes

  $CHANGES

  ## New Contributors

  $NEW_CONTRIBUTORS

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_TAG
