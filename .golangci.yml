version: "2"

linters:
  default: standard
  enable:
    - forbidigo
    - gocognit
    - gocyclo
    - sloglint
  settings:
    forbidigo:
      forbid:
        - pattern: ^slog\.(Default|SetDefault)$
          msg: pass an explicit *slog.Logger instead of the process-wide default
    sloglint:
      no-global: all
    # min-complexity is the highest value that still passes, not the value at
    # which reporting starts.
    gocognit:
      min-complexity: 20
    gocyclo:
      min-complexity: 12
  exclusions:
    rules:
      # Table-driven and integration tests are legitimately branchy, and
      # decomposing them tends to hide the assertions. Shared test
      # infrastructure under tests/integration/testkit is not excluded: it is
      # library code every integration test depends on.
      - path: _test\.go
        linters:
          - gocognit
          - gocyclo
      # Tests read slog.Default to prove production code leaves it unchanged.
      - path: _test\.go
        linters:
          - forbidigo

issues:
  # Report every metric a function violates in one run. With the default, an
  # issue on a line already reported by another linter is dropped, so a
  # gocyclo violation stays hidden until the gocognit one on the same
  # declaration is fixed.
  uniq-by-line: false
